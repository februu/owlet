[project]
name = "owlet"
version = "0.1.0"
description = "Owlet is a small async website health checker configured from one TOML file."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[project.scripts]
owlet = "owlet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owlet"]
